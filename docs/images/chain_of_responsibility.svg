<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="#0b0f19"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="25" y="20" width="850" height="50" rx="10" fill="url(#headerGrad)"/>
  <text x="450" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    Chain of Responsibility Pattern — Purchase Approval Workflow
  </text>

  <!-- Client Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="140" height="180" rx="12" fill="url(#boxGrad1)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="140" width="140" height="40" rx="12" fill="#1d4ed8"/>
    <rect x="40" y="168" width="140" height="12" fill="#1d4ed8"/>
    <text x="110" y="166" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Client (Main)</text>
    
    <text x="110" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Creates Request:</text>
    <rect x="55" y="225" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="243" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">amount: $X</text>
    
    <text x="110" y="285" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Sends to 1st handler</text>
  </g>

  <!-- Arrow Client -> Handler 1 -->
  <path d="M 180 230 L 230 230" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Handler 1: Manager -->
  <g filter="url(#shadow)">
    <rect x="240" y="120" width="180" height="220" rx="12" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="2"/>
    <rect x="240" y="120" width="180" height="45" rx="12" fill="url(#accentGreen)"/>
    <rect x="240" y="153" width="180" height="12" fill="url(#accentGreen)"/>
    <text x="330" y="148" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Manager</text>
    
    <rect x="255" y="180" width="150" height="30" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="330" y="200" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Limit: ≤ $10,000</text>

    <text x="330" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Can approve?</text>
    <text x="330" y="265" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ Approve &amp; Done</text>
    <text x="330" y="295" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">✗ Else pass to Director</text>
    <text x="330" y="325" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">nextApprover</text>
  </g>

  <!-- Arrow Handler 1 -> Handler 2 -->
  <path d="M 420 230 L 460 230" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="440" y="215" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">&gt; 10k</text>

  <!-- Handler 2: Director -->
  <g filter="url(#shadow)">
    <rect x="470" y="120" width="180" height="220" rx="12" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="470" y="120" width="180" height="45" rx="12" fill="url(#accentAmber)"/>
    <rect x="470" y="153" width="180" height="12" fill="url(#accentAmber)"/>
    <text x="560" y="148" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Director</text>

    <rect x="485" y="180" width="150" height="30" rx="6" fill="#78350f" stroke="#d97706" stroke-width="1"/>
    <text x="560" y="200" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Limit: ≤ $30,000</text>

    <text x="560" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Can approve?</text>
    <text x="560" y="265" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ Approve &amp; Done</text>
    <text x="560" y="295" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">✗ Else pass to VP</text>
    <text x="560" y="325" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">nextApprover</text>
  </g>

  <!-- Arrow Handler 2 -> Handler 3 -->
  <path d="M 650 230 L 690 230" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="670" y="215" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">&gt; 30k</text>

  <!-- Handler 3: VicePresident -->
  <g filter="url(#shadow)">
    <rect x="700" y="120" width="170" height="220" rx="12" fill="url(#boxGrad1)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="700" y="120" width="170" height="45" rx="12" fill="url(#accentPurple)"/>
    <rect x="700" y="153" width="170" height="12" fill="url(#accentPurple)"/>
    <text x="785" y="148" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">VicePresident</text>

    <rect x="715" y="180" width="140" height="30" rx="6" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
    <text x="785" y="200" fill="#ddd6fe" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Limit: ≤ $50,000</text>

    <text x="785" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Can approve?</text>
    <text x="785" y="265" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ Approve &amp; Done</text>
    <text x="785" y="295" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✗ Reject (Limit Exceeded)</text>
    <text x="785" y="325" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">End of Chain</text>
  </g>

  <!-- Bottom Legend Banner -->
  <rect x="40" y="380" width="830" height="65" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="60" y="405" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Key Takeaways:</text>
  <text x="60" y="428" fill="#94a3b8" font-family="sans-serif" font-size="11">
    • Client only talks to Manager  • Loose coupling  • Dynamic runtime chaining  • Single Responsibility per Approver
  </text>
</svg>
