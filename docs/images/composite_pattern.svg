<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="compositeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boxDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="hollowTriangle" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="#0b0f19"/>
  <rect x="1" y="1" width="898" height="518" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="25" y="20" width="850" height="50" rx="10" fill="url(#headerGrad)"/>
  <text x="450" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    Composite Design Pattern — Part-Whole Tree Hierarchy
  </text>

  <!-- TOP LEVEL: Component Interface (Employee) -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="95" width="240" height="95" rx="12" fill="url(#boxDark)" stroke="#818cf8" stroke-width="2"/>
    <rect x="330" y="95" width="240" height="35" rx="12" fill="url(#compGrad)"/>
    <rect x="330" y="118" width="240" height="12" fill="url(#compGrad)"/>
    <text x="450" y="117" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&lt;&lt;interface&gt;&gt; Employee</text>
    
    <text x="450" y="155" fill="#a5b4fc" font-family="monospace" font-size="13" text-anchor="middle">+ showDetails(): void</text>
    <text x="450" y="175" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">[Common Component Contract]</text>
  </g>

  <!-- Lines from Component to Leaf & Composite -->
  <path d="M 410 190 L 410 230 L 220 230 L 220 260" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 490 190 L 490 230 L 680 230 L 680 260" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- LEFT: Leaf Node (Developer) -->
  <g filter="url(#cardShadow)">
    <rect x="110" y="260" width="220" height="180" rx="12" fill="url(#boxDark)" stroke="#10b981" stroke-width="2"/>
    <rect x="110" y="260" width="220" height="40" rx="12" fill="url(#leafGrad)"/>
    <rect x="110" y="288" width="220" height="12" fill="url(#leafGrad)"/>
    <text x="220" y="286" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Developer (Leaf)</text>

    <text x="130" y="325" fill="#94a3b8" font-family="monospace" font-size="12">- name: String</text>
    <text x="130" y="348" fill="#94a3b8" font-family="monospace" font-size="12">- position: String</text>
    <line x1="120" y1="362" x2="320" y2="362" stroke="#334155" stroke-width="1"/>
    <text x="130" y="385" fill="#34d399" font-family="monospace" font-size="12">+ showDetails()</text>
    <text x="220" y="420" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">No children (End of branch)</text>
  </g>

  <!-- RIGHT: Composite Node (Manager) -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="260" width="250" height="180" rx="12" fill="url(#boxDark)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="560" y="260" width="250" height="40" rx="12" fill="url(#compositeGrad)"/>
    <rect x="560" y="288" width="250" height="12" fill="url(#compositeGrad)"/>
    <text x="685" y="286" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Manager (Composite)</text>

    <text x="580" y="322" fill="#94a3b8" font-family="monospace" font-size="12">- name: String</text>
    <text x="580" y="342" fill="#fcd34d" font-family="monospace" font-size="11">- team: List&lt;Employee&gt;</text>
    <line x1="570" y1="354" x2="800" y2="354" stroke="#334155" stroke-width="1"/>
    <text x="580" y="374" fill="#fbbf24" font-family="monospace" font-size="12">+ addEmployeeToTeam()</text>
    <text x="580" y="394" fill="#fbbf24" font-family="monospace" font-size="12">+ showDetails() [Loops team]</text>
    <text x="685" y="425" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Can hold Developers &amp; Managers</text>
  </g>

  <!-- Self-referencing recursive aggregation arrow from Manager back to Employee -->
  <path d="M 810 330 C 865 330, 865 140, 570 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowHead)"/>
  <text x="860" y="235" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90 860 235)">manages children</text>

  <!-- Bottom Legend Banner -->
  <rect x="25" y="455" width="850" height="50" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="45" y="476" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Why this rocks:</text>
  <text x="45" y="494" fill="#94a3b8" font-family="sans-serif" font-size="11">
    Client treats individual Developer &amp; complex Manager tree identically via <tspan fill="#38bdf8">employee.showDetails()</tspan> — no instanceof checks!
  </text>
</svg>
